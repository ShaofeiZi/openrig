name: 问题反馈
description: OpenRig 行为异常，或某条命令执行失败
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请附上最小复现步骤与相关版本信息。本报告将公开可见，请在命令、日志和配置中移除 API 密钥、令牌、私有提示词、个人信息与私有路径。
        若疑似安全漏洞，请按我们的[安全政策](https://github.com/mvschwarz/openrig/security/policy)私下报告，不要在此公开细节。
  - type: input
    id: version
    attributes:
      label: OpenRig 版本
      description: `zrig --version` 的输出（旧命令名 `rig` 同样可用）
      placeholder: 0.5.14 (2edc1b7a)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统、Node 与 tmux 版本
      placeholder: macOS 15.6, Node 22.22.1, tmux 3.5a
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: 涉及的智能体框架
      multiple: true
      options:
        - 无 / 不确定
        - Claude Code
        - Codex
        - Pi / Oh My Pi
        - 其他（在下面说明）
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 你执行了什么、实际发生了什么
      description: 命令、相关的（脱敏后）输出，以及你预期的结果。能贴文本就贴文本；可视化问题附截图更佳。
      render: shell
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: 可能相关的实例状态
      description: 全新安装还是升级？仅附上 status 输出或你的 rig 规格中相关的脱敏行；不要上传完整会话记录、凭据或整个实例目录。
  - type: checkboxes
    id: checks
    attributes:
      label: 自查项
      options:
        - label: 我已搜索过已有 issue 与 Discussions，确认没有重复。
          required: true
        - label: 我使用的是最新发布版本，或已在上面写明所用版本。
          required: true
