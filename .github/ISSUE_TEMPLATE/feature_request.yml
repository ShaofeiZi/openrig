name: 功能请求
description: 你希望 OpenRig 具备但目前没有的能力
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        对于开放性想法或“这个功能应该怎么做”的讨论，[Discussions › Ideas](https://github.com/mvschwarz/openrig/discussions/categories/ideas) 是更合适的地方。当你能明确说出想要的结果时，再使用本表。
        本请求将公开可见；请使用不含凭据、私有提示词或个人信息的示例。
  - type: textarea
    id: outcome
    attributes:
      label: 你想达成什么？当前是什么阻碍了你？
      description: 描述处境，而非解决方案。一个真实例子胜过泛泛而谈。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望 OpenRig 做什么？
      description: 一条命令、一个设置、一种行为都可以。粗略描述即可。
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 你目前是怎么绕过的？
  - type: input
    id: version
    attributes:
      label: OpenRig 版本
      placeholder: 0.5.14
