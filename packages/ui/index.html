<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zrig</title>
    <link rel="icon" href="data:," />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- OPR.0.4.3.29 — 首次绘制前应用主题（避免主题闪烁 flash-of-wrong-theme）。
         在模块脚本之前运行，确保 `.dark` 类在首次绘制前就挂到 <html> 上。
         与 src/lib/theme.ts 严格保持一致：存储键为 "openrig.theme"；
         light/dark 为显式取值并优先；"system"（以及任何未设置/非法值）跟随
         prefers-color-scheme。两处必须保持同步。 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("openrig.theme");
          var choice = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark =
            choice === "dark" ||
            (choice === "system" &&
              typeof window.matchMedia === "function" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage/matchMedia 不可用 —— 回退到浅色（不加类）。 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
