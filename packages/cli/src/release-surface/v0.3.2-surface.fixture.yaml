# 已知的 v0.3.2 CLI 新增入口——AC-2 自验证 fixture（OPR.0.3.3.13.1）。
#
# 每一项都根据发布说明和旁证来源独立推导，再与解析器输出交叉核对。它既是无假阴性的
# 最低要求，也是这里通过构造得到的准确新增 flag 集合，因此测试还会断言解析器在命令
# 粒度上既没有多报，也没有漏报。
#
# 来源（均引用 main@8b2cb181）：
#   - 主要来源：docs/releases/v0.3.2.md
#   - 旁证：CHANGELOG.md 的 v0.3.2 章节
#   - 事实来源：git diff --name-status v0.3.1 v0.3.2 -- packages/cli/src/commands/
#       (ADDED: scope.ts, rig-policy.ts; MODIFIED: bundle/config-init-workspace/ps/queue/up/workflow/workspace)
#
# 注册名不是文件名：`policy` 是 rig-policy.ts:150 的 `new Command("policy")`；
# 文件名是 rig-policy，命令名是 policy。
#
# AC-2 对齐说明（解析器与发布文档叙述）：
#   此处不列 `zrig up --existing`。发布文档在“up paper-cut fixes”故事下提到
#   `--existing`（第 219 行），但该 flag 在 v0.3.1 中已经存在（up.ts:32），且在
#   v0.3.2 中未变化（up.ts:40），因此它不是 v0.3.1->v0.3.2 的新增入口。基于源码的
#   解析器正确地将其省略；更早的 fixture 草稿因过度解读叙述而包含它，本次自验证发现了
#   这个问题。源码/tag diff 的权威性高于发布文档叙述。
added_commands:
  - name: policy   # rig-policy.ts:150 new Command("policy"); doc L79-86, 166-189
  - name: scope    # scope.ts:690 new Command("scope"); doc L87-93, 190-205
added_flags:
  - command: queue create   # queue.ts:156-158; doc L60-64, 148-164
    flags: [--body-file, --mission, --slice]
  - command: workspace      # doc L65-68, 131-146 (new `doctor` subcommand)
    subcommands: [doctor]
  - command: bundle         # doc L110, 127-129 (new `history` subcommand)
    subcommands: [history]
  - command: bundle create  # doc L104-105 (version-gate + notes flags)
    flags: [--min-cli-version, --min-daemon-version, --notes]
  - command: bundle install # doc L109, 122-125 (operator-explicit override flags)
    flags: [--force, --skip-version-check]
