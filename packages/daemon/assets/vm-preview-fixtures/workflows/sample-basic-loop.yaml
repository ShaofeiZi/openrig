# 已填充 VM 预览使用的示例工作流。
# 它使用独立 ID，复制到已填充后台服务的工作流配置目录后，
# 不会与内置 basic-loop 规范冲突。后台服务会在下次列出工作流库时发现它。
workflow:
  id: vm-preview-basic-loop
  version: 1
  objective: >
    让一个工作包缓慢经过 conveyor 工作组，使新用户有足够时间检查每次交接。
  target:
    rig: conveyor
  entry:
    role: intake
  coordination_terminal_turn_rule: hot_potato
  roles:
    intake:
      skill_refs: [openrig-user, backlog-capture]
      preferred_targets: [intake-lead@conveyor]
    planner:
      skill_refs: [openrig-user, verification-before-completion]
      preferred_targets: [plan-planner@conveyor]
    builder:
      skill_refs: [openrig-user]
      preferred_targets: [build-builder@conveyor]
    reviewer:
      skill_refs: [openrig-user, review-team]
      preferred_targets: [review-reviewer@conveyor]
    closer:
      skill_refs: [openrig-user]
      preferred_targets: [intake-lead@conveyor]
  steps:
    - id: intake
      actor_role: intake
      objective: 重新陈述目标，并交接一个工作包。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [planner]
    - id: plan
      actor_role: planner
      objective: 为一轮构建产出简短计划。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [builder]
    - id: build
      actor_role: builder
      objective: 构建或起草计划中的产物。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [reviewer]
    - id: review
      actor_role: reviewer
      objective: 检查产物并确认可以收尾。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [closer]
    - id: close
      actor_role: closer
      objective: 完成本次演示工作包。
      allowed_exits: [done, failed]
      next_hop:
        mode: forbid
  invariants:
    continuation_required: true
    preserve_lineage: true
    closure_required: true
    allowed_exits: [handoff, waiting, done, failed]
  loop_guards:
    max_hops: 10
    spawn_budget: 0
  closure:
    success: 演示工作包已完成。
    degraded: 演示因已明确说明的阻塞项而停止。
    failed: 演示失败，并有证据记录。
