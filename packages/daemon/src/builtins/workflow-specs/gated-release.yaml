# OpenRig 0.4.6 spec 语言示例——带 gate 的阶段形态。
# 最后一步设人工签核 gate（编译为已发布的 human-route 机制：tier human-gate + summary +
# evidence_ref，由 `rig queue resolve` 解决），并附逐步骤 harness 固定值。
workflow:
  id: gated-release
  version: 1
  objective: 构建、验证，然后在人工 gate 挂起发布决策。
  roles:
    builder:
      preferred_targets: [flow-builder@acme-flow]
    prover:
      preferred_targets: [flow-prover@acme-flow, flow-prover2@acme-flow]
  steps:
    - id: build
      actor_role: builder
      harness: claude-code
    - id: prove
      actor_role: prover
      harness: codex
    - id: ship-signoff
      actor_role: prover
      gate:
        target: human@kernel
        summary: "发布候选项已验证；请批准发布"
        evidence_ref: proof/PROOF.md
