# OpenRig 0.4.6 spec 语言示例——分支修复形态。
# `failed` 分支进入 remediation 步骤（分支键只能是记录下来的退出枚举）；
# remediate → verify → remediate 循环由分支产生，只有在声明 max_hops 后才合法
#（移除 loop_guards 后，验证会失败并指出循环及修复方式）。
workflow:
  id: branched-remediation
  version: 1
  objective: 使用有界失败路径修复循环完成构建。
  loop_guards:
    max_hops: 8
  roles:
    builder:
      preferred_targets: [flow-builder@acme-flow]
    fixer:
      preferred_targets: [flow-fixer@acme-flow]
    prover:
      preferred_targets: [flow-prover@acme-flow]
  steps:
    - id: build
      actor_role: builder
      next_hop:
        on: { failed: remediate }
    - id: verify
      actor_role: prover
      next_hop:
        on: { failed: remediate }
    - id: remediate
      actor_role: fixer
      next_hop:
        suggested_roles: [prover]
