# OpenRig 0.3.0 入门 workflow。
# 通用工位流水线。多个 workflow 实例可同时运行；每个工位的队列深度就是背压信号。
workflow:
  id: conveyor
  version: 1
  objective: >
    在通用 conveyor 入门 rig 中，让一个工作包依次经过接收、规划、构建、评审和关闭。
  target:
    rig: conveyor
  entry:
    role: intake
  coordination_terminal_turn_rule: hot_potato
  roles:
    intake:
      skill_refs: [openrig-user, backlog-capture, orchestration-team]
      preferred_targets: [intake-lead@conveyor]
    planner:
      skill_refs: [openrig-user, requirements-writer]
      preferred_targets: [plan-planner@conveyor]
    builder:
      skill_refs: [openrig-user, development-team, test-driven-development]
      preferred_targets: [build-builder@conveyor]
    reviewer:
      skill_refs: [openrig-user, review-team, plan-review]
      preferred_targets: [review-reviewer@conveyor]
    closer:
      skill_refs: [openrig-user, orchestration-team, verification-before-completion]
      preferred_targets: [intake-lead@conveyor]
  steps:
    - id: intake
      actor_role: intake
      objective: 澄清请求，创建一个小工作包并交给规划环节。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [planner]
    - id: plan
      actor_role: planner
      objective: 将工作包转化为带验证方案的可执行计划。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [builder]
    - id: build
      actor_role: builder
      objective: 执行计划并产出供评审使用的证据。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [reviewer]
    - id: review
      actor_role: reviewer
      objective: >
        检查构建输出。需要时使用普通 queue handoff 将针对性返工送回构建环节；
        工作包可以关闭时使用 workflow handoff 路径。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [closer, builder]
    - id: close
      actor_role: closer
      objective: 带证据和必要的后续说明关闭工作包。
      allowed_exits: [done, failed]
      next_hop:
        mode: forbid
  invariants:
    continuation_required: true
    preserve_lineage: true
    closure_required: true
    allowed_exits: [handoff, waiting, done, failed]
  loop_guards:
    max_hops: 20
    spawn_budget: 0
  closure:
    success: 工作包已带证据关闭。
    degraded: 工作包因明确的阻塞项或后续事项而停止。
    failed: 工作包失败；保留评审发现和负责人。
