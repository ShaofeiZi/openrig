# OpenRig 0.4.6 spec 语言示例——线性流水线形态。
# 不使用任何 WF-2 功能：按声明顺序路由，与 WF-1 引擎行为逐字节一致（零回归参考形态）。
workflow:
  id: linear-build
  version: 1
  objective: 让一个工作包按声明顺序依次经过 plan、build 和 prove。
  roles:
    planner:
      preferred_targets: [flow-planner@acme-flow]
    builder:
      preferred_targets: [flow-builder@acme-flow]
    prover:
      preferred_targets: [flow-prover@acme-flow]
  steps:
    - id: plan
      actor_role: planner
    - id: build
      actor_role: builder
    - id: prove
      actor_role: prover
