# OpenRig 0.4.6 canonical 单 rig RSI 工厂 MVP（OPR.0.4.6.FAC2）。
#
# 一个 rig + 一个 workflow = 递归自我改进工厂 MVP。带内内循环是由引擎路由的有界 SDLC：
#   plan → implement → qa_check → review → release
# 受可执行的 max_hops 守卫约束（WF-1 许可）；检查或评审失败会路由回 implement 进行有界修复；
# 异常通过 WF-5 拨盘路由（orchestrator 优先）；release 环节准备发布内容，并在人工 gate 挂起发布
# 决策（publish 是人工行为）。运行于已发布引擎，使用 v0 硬编码接缝（固化 target.rig +
# preferred_targets），无需绑定层。
#
# RSI 递归是解耦的 dogfood 边：dogfood 席位带外持续面向已发布产品运行（不是对构建产物做第二轮
# QA），并把发现反馈到下一份计划；MVP 中无 gate、无循环停止。精确的持续带外 runtime 机制将在
# 后续版本完善；此处内循环位于带内，dogfood 是带外输入，由下方 `dogfood` 角色引用。
workflow:
  id: factory-rsi
  version: 1
  objective: >
    在单个 rig 上，以有界、确定性且由引擎路由的内循环规划、构建、检查、评审和发布一个 slice。
    Dogfood 带外面向已发布产品运行，并将发现反馈到下一份计划——这就是无需人工参与的 RSI 边。
  target:
    rig: factory-rsi
  entry:
    role: planner
  coordination_terminal_turn_rule: hot_potato
  # 异常优先路由给 orchestrator（WF-5 v1.3 拨盘）；人工通过 awareness 行在高层获知。下方
  # orchestrator 角色是拨盘目标，通过相同的 role→preferred_targets 机制解析。
  exception_routing:
    default: orchestrator
    orchestrator_role: orchestrator
  roles:
    planner:
      skill_refs: [openrig-user, requirements-writer]
      preferred_targets: [plan-planner@factory-rsi]
    implementer:
      skill_refs: [openrig-user, development-team, test-driven-development]
      preferred_targets: [build-implementer@factory-rsi]
    qa:
      skill_refs: [openrig-user, verification-before-completion]
      preferred_targets: [check-qa@factory-rsi]
    reviewer:
      skill_refs: [openrig-user, review-team, plan-review]
      preferred_targets: [review-reviewer@factory-rsi]
    release_manager:
      skill_refs: [openrig-user, release-manager]
      preferred_targets: [release-manager@factory-rsi]
    orchestrator:
      skill_refs: [openrig-user, orchestration-team]
      preferred_targets: [orch-lead@factory-rsi]
    # dogfood 角色与内循环解耦：它带外面向已发布产品运行，并把发现反馈到下一份计划（RSI 边）。
    # 此处有意不把它设为内循环步骤；持续带外 runtime 机制将在后续版本完善。
    dogfood:
      skill_refs: [openrig-user, dogfood, systematic-debugging]
      preferred_targets: [dogfood-tester@factory-rsi]
  steps:
    - id: plan
      actor_role: planner
      objective: >
        将当前输入——第 1 个周期的产品语料，或此后记录下来的带外 dogfood 发现——转化为一个
        可构建的 slice spec。发现以记录下来的闭环证据到达，绝不通过聊天。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [implementer]
    - id: implement
      actor_role: implementer
      objective: 按计划构建 slice，并为检查产出证据。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [qa]
    - id: qa_check
      actor_role: qa
      objective: >
        检查构建产物。通过则交给 review；检查失败（产物判定，而非步骤故障）则路由回 implement
        进行有界修复。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [reviewer]
        on:
          failed: implement
    - id: review
      actor_role: reviewer
      objective: >
        评审产物（与构建者采用跨 runtime 多样性）。通过则交给发布准备；评审失败则路由回 implement。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [release_manager]
        on:
          failed: implement
    - id: release_prep
      actor_role: release_manager
      objective: >
        准备发布说明、文档/网站更新与发布 PR，并在工作区的 `proof/PROOF.md` 记录本周期发布证据
        （sign-off gate 指向的 `evidence_ref`）。这是 release-manager 的实际工作，且在所有 gate
        之前运行——先有准备好的产物；publish 仍是人工行为（在 release_signoff 挂起）。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        # 显式 step-id 路由（不是 suggested_roles）：release_prep 和 release_signoff 共用
        # release_manager actor_role，因此基于角色的 hop 有歧义（会匹配第一个 release_manager
        # 步骤）。所以准备好的产物会在下方人工 gate 之前存在。
        on:
          handoff: release_signoff
    - id: release_signoff
      actor_role: release_manager
      objective: >
        针对 release_prep 中已准备好的发布产物，在人工 gate 挂起发布决策。批准后由人工继续
        publish；不会自动发布任何内容。
      allowed_exits: [done, waiting, failed]
      gate:
        target: human@kernel
        summary: "RSI 周期状态正常；发布产物已准备——请批准发布（publish 是人工行为）。"
        # 指向 release_prep 所记录发布证据的工作区相对路径（与已发布 gated-release.yaml 示例
        # 使用相同约定）；它在运行中的工作区按周期生成，不是 slice 文件。
        evidence_ref: proof/PROOF.md
      next_hop:
        mode: forbid
  invariants:
    continuation_required: true
    preserve_lineage: true
    closure_required: true
    allowed_exits: [handoff, waiting, done, failed]
  loop_guards:
    # 可强制执行（整数 >= 1）——许可有界修复循环（qa_check→implement、review→implement）；
    # WF-1 验证器要求此项，Argo 无界递归教训也要求它。触发后成为 WF-5 异常；resume 会批准
    # 一个新的有界窗口（WF-5 FR-4 活锁护栏）。
    max_hops: 20
    spawn_budget: 0
  closure:
    success: RSI 周期状态正常；发布候选项已准备，并在人工发布 gate 挂起。
    degraded: 周期因明确的阻塞项或有界 max_hops 触发而停止，等待 resume。
    failed: 步骤以异常形式失败；保留发现并通过拨盘路由。
