# OpenRig 0.3.0 入门 workflow。
# 较慢的演示循环，用于观察一个工作包如何从头到尾流转。
workflow:
  id: basic-loop
  version: 1
  objective: >
    让一个工作包以足够慢的速度通过 conveyor rig，使新用户能够检查每次 handoff。
  target:
    rig: conveyor
  entry:
    role: intake
  coordination_terminal_turn_rule: hot_potato
  roles:
    intake:
      skill_refs: [openrig-user, backlog-capture]
      preferred_targets: [intake-lead@conveyor]
    planner:
      skill_refs: [openrig-user, verification-before-completion]
      preferred_targets: [plan-planner@conveyor]
    builder:
      skill_refs: [openrig-user]
      preferred_targets: [build-builder@conveyor]
    reviewer:
      skill_refs: [openrig-user, review-team]
      preferred_targets: [review-reviewer@conveyor]
    closer:
      skill_refs: [openrig-user]
      preferred_targets: [intake-lead@conveyor]
  steps:
    - id: intake
      actor_role: intake
      objective: 重述目标并交接一个工作包。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [planner]
    - id: plan
      actor_role: planner
      objective: 为一次构建轮次制定简短计划。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [builder]
    - id: build
      actor_role: builder
      objective: 构建或起草计划中的输出。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [reviewer]
    - id: review
      actor_role: reviewer
      objective: 检查输出并确认可以闭环。
      allowed_exits: [handoff, waiting, failed]
      next_hop:
        mode: require
        suggested_roles: [closer]
    - id: close
      actor_role: closer
      objective: 关闭演示工作包。
      allowed_exits: [done, failed]
      next_hop:
        mode: forbid
  invariants:
    continuation_required: true
    preserve_lineage: true
    closure_required: true
    allowed_exits: [handoff, waiting, done, failed]
  loop_guards:
    max_hops: 10
    spawn_budget: 0
  closure:
    success: 演示工作包已关闭。
    degraded: 演示因明确的阻塞项而停止。
    failed: 演示失败，并已保留证据。
