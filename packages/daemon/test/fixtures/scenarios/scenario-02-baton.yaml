# 场景 #2——queue-baton-survives-restart（51-02 验证项 2 + 7）。
#
# 证明：已认领的队列 baton（in-progress + owner）能在席位重新启动后保留。
# Runner 针对场景本地的实时后台服务驱动已发布 zrig CLI（以产品为准）：
# up -> 观察队列 -> restart <seat> -> 观察队列 -> down。
#
# BATON 前置条件（fixture 层）。根据锁定语法，场景断言可观察结果；`env` 块建立前置
# 条件——不存在 queue ACTION 动词（动词集合 = topology/seat + daemon:{op}）。pipeline
# 会在步骤前执行以下已发布的 `zrig queue` 写入，因此审查者能准确看到 baton 来源
#（队列状态位于后台服务侧，与任何席位进程无关）：
#   OPENRIG_SESSION_NAME=harness@scn-baton    zrig queue create --id baton-1 \
#       --destination dev-worker@scn-baton --summary "..."
#   OPENRIG_SESSION_NAME=dev-worker@scn-baton zrig queue claim baton-1 \
#       --destination dev-worker@scn-baton
# => qitem baton-1 从一开始就是 state=in-progress，owner 为 dev-worker@scn-baton。
#（根据 P21 I3，身份通过 env→transport header 传递；旧 --source flag 已退役：已弃用，
# 且已发布 CLI 会忽略它。下面的 `source:` 字段是 pipeline 作为逐调用 env 身份携带的
# 声明来源。）
#
# 延期断言（items-6-8 门禁——必须明确标注，不能静默丢弃）：
# 锁定的 #2 还要求重新启动后断言 `expect { surface: pane, seat: dev-worker,
# contains: "restored" }`。13e26355 的 stub-runner 只输出 READY/EXITED；打印
# “restored”窗格标记的 `restore` 种子行为属于 A5 items 6-8（dev-driver 的下一次队列拉取，
# qitem 00bf5dbe）。因此这一项断言暂时保留在这里，items 6-8 落地后即可启用；runner
# 和 #2 的其余部分现已证明。裁定：orch-advisor Option A（2026-08-05）；
# 记录：FINDING-51-02-scenario2-restored-gate.md。
scenario: queue-baton-survives-restart
topology: ./topo-stub-baton.yaml
env:
  queue:
    - id: baton-1
      source: harness@scn-baton
      destination: dev-worker@scn-baton
      summary: "51-02 baton — survives a worker relaunch"
      claim: true
steps:
  - up: {}
  # 操作席位前，baton 已处于 in-progress 且已有 owner。
  - expect:
      surface: queue
      within: 20s
      match:
        - qitemId: baton-1
          state: in-progress
          destinationSession: dev-worker@scn-baton
  # 后台服务重启——这一断言范围是有意选择的。
  #
  # 已批准（orch-advisor，2026-08-11）：这证明了比锁定 #2 要求严格得多的持久性。
  # 席位重启从不触碰后台服务状态，因此锁定形式只测试 baton 能否跨越一个并不拥有它的进程；
  # 此处则终止并重新生成拥有 SQLite 的进程，并证明 qitem 在这一过程中逐字节不变。
  #
  # 两种不同的失败模式——不要混淆：
  #   此处已证明——ROW 能否在其 OWNER 进程终止后保留？
  #   此处未证明——重新启动的席位能否重新关联到已认领 baton，且其窗格是否显示
  #                “restored”？这是锁定 #2 的目标，目前仍未测试。
  #
  # 已发布动词集合无法表达席位重新启动这一半：对 RUNNING 节点执行 `zrig launch` 是 no-op
  #（"already_running"）；对停止节点执行则需要快照；目前不存在无需快照的逐席位
  # kill+relaunch 动词。这是产品缺口，不是为了方便而做的选择，因此该部分延期到 A5
  # items 6-8；架构验收表第 2 行的“expressible today”标记作为 0.5.1 发现交给 PM。
  #
  # 锁定格式要求这些动词彼此独立（PRD 第 20 行：二者互不路由），因此 daemon-restart
  # 不能替代 seat-level restart；它是并列的另一项、更严格的性质。
  - daemon: { op: restart }
  - expect:
      surface: queue
      within: 20s
      match:
        - qitemId: baton-1
          state: in-progress
          destinationSession: dev-worker@scn-baton
  # 延期（items-6-8）：expect { surface: pane, seat: dev-worker, contains: restored }
  - down: {}
