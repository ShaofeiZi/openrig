# 51-02 delta D1 fixture——一个 pod 中有三个 runtime:stub 席位。
#
# 验证逐席位脚本投递：两个席位分别获得不同的场景解析脚本，第三个没有映射，必须回退到
# 51-01 的内置默认值。相对闭包（culture_file + local: agent_ref）决定了不能只暂存一个
# YAML——两者都相对于 rig-spec 目录解析，因此必须暂存整个源根目录。
version: "0.2"
name: scn-scripts
culture_file: culture.md
pods:
  - id: dev
    label: 开发
    members:
      - id: alpha
        agent_ref: "local:agents/worker"
        profile: default
        runtime: stub
        cwd: .
      - id: beta
        agent_ref: "local:agents/worker"
        profile: default
        runtime: stub
        cwd: .
      - id: gamma
        agent_ref: "local:agents/worker"
        profile: default
        runtime: stub
        cwd: .
    edges: []
