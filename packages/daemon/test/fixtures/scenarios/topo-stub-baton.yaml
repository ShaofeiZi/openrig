# Slice 51-02 fixture 拓扑——供场景 runner 使用的最小 runtime:stub 工作组。
#
# 一个 pod（dev）包含一个 stub 席位（worker）。stub 运行时是确定性的 Node 脚本运行壳
#（51-01），因此该拓扑无需实时 LLM，也能在真实 tmux 中以无头方式启动。席位的
# canonical 会话 = <pod>-<member>@<rigName> = dev-worker@scn-baton
#（deriveCanonicalSessionName），即队列 baton 的目标。
version: "0.2"
name: scn-baton
culture_file: culture.md
pods:
  - id: dev
    label: 开发
    members:
      - id: worker
        agent_ref: "local:agents/worker"
        profile: default
        runtime: stub
        cwd: .
    edges: []
