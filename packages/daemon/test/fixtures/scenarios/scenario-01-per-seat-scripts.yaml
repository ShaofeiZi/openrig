# 场景——逐席位解析的 stub 脚本（51-02 mini-req 5，delta D1）。
#
# 在一次真实 host-mode 运行中证明：
#   R1  已提交 fixture 的相对闭包（culture_file: culture.md、
#       agent_ref: local:agents/worker）在暂存后仍能解析——`up` 成功；
#       如果暂存过程改变了 spec 根目录，就不可能成功；
#   R2  两个使用不同脚本的席位各自只运行自己的脚本；
#   R3  已配置脚本的席位旁边存在未映射席位时，后者仍使用 51-01 的
#       内置默认值，绝不使用相邻席位的脚本。
#
# 交付发生在 `up`：pipeline 暂存一个自包含拓扑根目录，在暂存副本中为每个席位设置
# 独立 cwd，并将各映射席位的脚本写入 <that seat's cwd>/.openrig/stub/script.json；
# 这是已发布 stub 自身的契约。
scenario: per-seat-stub-scripts
topology: ./topo-stub-scripts.yaml
env:
  stub_scripts:
    dev-alpha: ./scripts/alpha.json
    dev-beta: ./scripts/beta.json
    # dev-gamma 有意不进行映射（R3）。
steps:
  - up: {}
  - expect:
      surface: pane
      seat: dev-alpha@scn-scripts
      within: 30s
      contains: "[alpha-script]"
  - expect:
      surface: pane
      seat: dev-beta@scn-scripts
      within: 30s
      contains: "[beta-script]"
  # 未映射席位运行内置默认脚本，而不是相邻席位的脚本。
  - expect:
      surface: pane
      seat: dev-gamma@scn-scripts
      within: 30s
      contains: "[stub] scripted reply: acknowledged"
  - down: {}
