name: conveyor-planner
version: "1.0"
description: 流水线规划智能体——把已接受的工作包转化为小型可执行计划

defaults:
  runtime: codex

imports:
  - ref: local:../../shared

profiles:
  default:
    uses:
      skills: [requirements-writer, context-builder, verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md
    - id: startup-context
      path: startup/context.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
