name: shared
version: "1.0"
description: 供打包 starter 智能体使用的 OpenRig 内置共享资源

resources:
  skills:
    - id: agent-browser
      path: skills/process/agent-browser
    - id: dogfood
      path: skills/process/dogfood
    - id: frontend-design
      path: skills/process/frontend-design
    - id: openrig-architect
      path: skills/core/openrig-architect
    - id: rig-lifecycle
      path: skills/core/rig-lifecycle
    - id: openrig-upgrade
      path: skills/core/openrig-upgrade
    - id: test-driven-development
      path: skills/process/test-driven-development
    - id: systematic-debugging
      path: skills/process/systematic-debugging
    - id: verification-before-completion
      path: skills/process/verification-before-completion
    - id: orchestration-team
      path: skills/pods/orchestration-team
    - id: development-team
      path: skills/pods/development-team
    - id: review-team
      path: skills/pods/review-team
    # 产品管理技能。
    - id: office-hours
      path: skills/pm/office-hours
    - id: context-builder
      path: skills/pm/context-builder
    - id: requirements-writer
      path: skills/pm/requirements-writer
    - id: ui-mockup
      path: skills/pm/ui-mockup
    - id: plan-review
      path: skills/pm/plan-review
    - id: exec-summary
      path: skills/pm/exec-summary
    - id: backlog-capture
      path: skills/pm/backlog-capture
  plugins:
    - id: openrig-core
      source:
        kind: local
        path: ~/.openrig/plugins/openrig-core
  runtime_resources:
    - id: claude-default-settings
      path: runtime/claude-settings.fragment.json
      runtime: claude-code
      type: claude_settings_fragment
    - id: claude-default-mcp
      path: runtime/claude-mcp.fragment.json
      runtime: claude-code
      type: claude_mcp_fragment
    - id: codex-default-config
      path: runtime/codex-config.fragment.toml
      runtime: codex
      type: codex_config_fragment
    - id: claude-activity-hooks
      path: runtime/claude-activity-hooks.json
      runtime: claude-code
      type: claude_activity_hooks

profiles: {}
