name: product-designer
version: "1.0"
description: 产品设计智能体——塑造用户体验、交互流程与设计系统一致性

defaults:
  runtime: claude-code

imports:
  - ref: local:../../shared

profiles:
  default:
    uses:
      skills: [development-team, frontend-design, verification-before-completion]
      guidance: []
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config, shared:claude-activity-hooks]

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions:
    - type: send_text
      value: >-
        完成已分配的目标及选定流程。设计界面时使用 frontend-design，验证结果时使用
        verification-before-completion。任务需要时再加载相关技能；此启动操作不增加
        全量预加载或评审门禁。
      phase: after_ready
      applies_on: [fresh_start, restore]
      idempotent: true
