name: pm
version: "1.0"
description: >
  产品经理智能体——负责功能的“做什么”和“为什么”。执行从想法收集到开发交接的
  8 步功能流程，不做架构决策、工作量估算或实现选择。

defaults:
  runtime: claude-code

imports:
  - ref: "local:../../shared"

profiles:
  default:
    uses:
      skills:
        - office-hours
        - context-builder
        - requirements-writer
        - ui-mockup
        - plan-review
        - exec-summary
        - backlog-capture
      plugins: [shared:openrig-core]
      runtime_resources:
        - shared:claude-default-settings
        - shared:claude-default-mcp
        - shared:codex-default-config
        - shared:claude-activity-hooks

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
