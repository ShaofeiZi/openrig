version: "0.2"
name: research-team
summary: >
  研究拓扑，由编排智能体协调分析员与综合员。分析员开展深入调查，综合员把发现汇总为
  可执行摘要。

pods:
  - id: orch
    label: 编排
    members:
      - id: lead
        agent_ref: "local:../../../agents/orchestration/orchestrator"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: research
    label: 研究 Pod
    members:
      - id: analyst
        agent_ref: "local:../../../agents/research/analyst"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: synthesizer
        agent_ref: "local:../../../agents/research/synthesizer"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

edges:
  - kind: delegates_to
    from: orch.lead
    to: research.analyst
  - kind: delegates_to
    from: orch.lead
    to: research.synthesizer
