version: "0.2"
name: pm-team
culture_file: CULTURE.md
summary: >
  产品管理工作组，由 PM 负责人执行八步功能流程（验证、上下文、需求、mockup、评审、
  执行摘要与交接）。包含一名负责竞品、监管和客户情报的研究员，以及一名负责 UI mockup
  与原型的编码人员。

pods:
  - id: pm
    label: 产品管理
    members:
      - id: lead
        agent_ref: "local:../../../agents/product-management/pm"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: researcher
        agent_ref: "local:../../../agents/research/analyst"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: lead
        to: researcher
      - kind: escalates_to
        from: researcher
        to: lead

  - id: dev
    label: 开发支持
    members:
      - id: coder
        agent_ref: "local:../../../agents/development/implementer"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

edges:
  - kind: delegates_to
    from: pm.lead
    to: dev.coder
  - kind: can_observe
    from: dev.coder
    to: pm.researcher
  - kind: escalates_to
    from: dev.coder
    to: pm.lead
