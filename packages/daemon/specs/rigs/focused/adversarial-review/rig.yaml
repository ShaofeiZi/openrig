version: "0.2"
name: adversarial-review
summary: >
  两名独立评审智能体与一名编排智能体。每名评审者独立分析代码，随后由编排智能体
  综合他们的发现。分歧用于暴露真实问题。

pods:
  - id: orch
    label: 编排
    members:
      - id: lead
        agent_ref: "local:../../../agents/orchestration/orchestrator"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: review
    label: 评审团队
    members:
      - id: r1
        agent_ref: "local:../../../agents/review/independent-reviewer"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: r2
        agent_ref: "local:../../../agents/review/independent-reviewer"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

edges:
  - kind: delegates_to
    from: orch.lead
    to: review.r1
  - kind: delegates_to
    from: orch.lead
    to: review.r2
