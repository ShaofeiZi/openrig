version: "0.2"
name: conveyor
summary: >
  OpenRig 0.3.0 的可投产 starter：一条包含接入、规划、构建与评审席位的紧凑工位流水线。
  可用它观察队列工作如何经过交接流转，同时不继承任何内部发布耦合。

culture_file: CULTURE.md

pods:
  - id: intake
    label: 接入
    members:
      - id: lead
        agent_ref: "local:../../../agents/conveyor/lead"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: plan
    label: 规划
    members:
      - id: planner
        agent_ref: "local:../../../agents/conveyor/planner"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

  - id: build
    label: 构建
    members:
      - id: builder
        agent_ref: "local:../../../agents/conveyor/builder"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: review
    label: 评审
    members:
      - id: reviewer
        agent_ref: "local:../../../agents/conveyor/reviewer"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

edges:
  - kind: delegates_to
    from: intake.lead
    to: plan.planner
  - kind: delegates_to
    from: plan.planner
    to: build.builder
  - kind: delegates_to
    from: build.builder
    to: review.reviewer
  - kind: can_observe
    from: review.reviewer
    to: build.builder
  - kind: can_observe
    from: review.reviewer
    to: intake.lead
  - kind: can_observe
    from: intake.lead
    to: build.builder
  - kind: can_observe
    from: intake.lead
    to: review.reviewer
