version: "0.2"
name: kernel
summary: >
  仅 Codex 的内核变体：三个智能体全部在 Codex 上运行。当 zrig 后台服务启动时，
  若 Codex 登录状态正常但 Claude 鉴权状态失败，则选择此变体。

culture_file: culture/CULTURE.md

pods:
  - id: advisor
    label: 顾问
    members:
      - id: lead
        agent_ref: "local:agents/advisor/lead"
        runtime: codex
        profile: default
        cwd: "."

  - id: operator
    label: 操作员
    members:
      - id: human
        agent_ref: "builtin:terminal"
        runtime: terminal
        profile: none
        cwd: "."
        startup:
          actions:
            - type: send_text
              value: rig tui
              phase: after_ready
              applies_on: [fresh_start]
              idempotent: true
      - id: agent
        agent_ref: "local:agents/operator/agent"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - kind: collaborates_with
        from: agent
        to: human
      - kind: escalates_to
        from: agent
        to: human

  - id: queue
    label: 队列
    members:
      - id: worker
        agent_ref: "local:agents/queue/worker"
        runtime: codex
        profile: default
        cwd: "."

edges:
  - kind: delegates_to
    from: advisor.lead
    to: operator.agent
  - kind: delegates_to
    from: advisor.lead
    to: queue.worker
  - kind: escalates_to
    from: queue.worker
    to: advisor.lead
