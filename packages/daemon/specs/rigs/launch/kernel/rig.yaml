version: "0.2"
name: kernel
summary: >
  默认双运行时模板的资源库预览，并非正在运行的内核。首次自动启动会根据可用且已鉴权的
  运行时，从仅 Claude、仅 Codex 或双运行时变体中选择。使用
  `zrig ps --nodes --rig kernel` 查看当前席位；托管工作组的规范会显示已选拓扑。
  这是单实例常驻工作组：顾问引导用户意图，操作员运行 OpenRig 本身，队列 worker 对
  流转队列基础数据分类。首次启动 zrig 后台服务时自动引导（V0.3.1 slice 05）。后续后台服务
  重启时，工作组记录持久化在 SQLite 中，内核启动路径会对已托管项短路，不会重新创建工作组。
  仅重启后台服务时，成员 tmux 会话继续存活；主机重启会终止 tmux，协调器将会话标为 detached，
  此时操作员 Pod 通过当前操作员工作流负责智能体重启流程。双运行时变体要求 Claude Code 与
  Codex 均已鉴权。

culture_file: culture/CULTURE.md

pods:
  - id: advisor
    label: 顾问
    members:
      - id: lead
        agent_ref: "local:agents/advisor/lead"
        runtime: claude-code
        profile: default
        cwd: "."

  - id: operator
    label: 操作员
    members:
      - id: human
        # 共享任务控制；人类接入并与智能体使用同一窗格。
        agent_ref: "builtin:terminal"
        runtime: terminal
        profile: none
        cwd: "."
        startup:
          actions:
            - type: send_text
              value: rig tui
              phase: after_ready
              applies_on: [fresh_start]
              idempotent: true
      - id: agent
        agent_ref: "local:agents/operator/agent"
        runtime: codex
        profile: default
        cwd: "."
    edges:
      - kind: collaborates_with
        from: agent
        to: human
      - kind: escalates_to
        from: agent
        to: human

  - id: queue
    label: 队列
    members:
      - id: worker
        agent_ref: "local:agents/queue/worker"
        runtime: codex
        profile: default
        cwd: "."

edges:
  - kind: delegates_to
    from: advisor.lead
    to: operator.agent
  - kind: delegates_to
    from: advisor.lead
    to: queue.worker
  - kind: escalates_to
    from: queue.worker
    to: advisor.lead
