name: operator.agent
version: "1.0"
description: 操作员智能体——运行 OpenRig 本身，在重启后启动、停止或恢复工作组，并负责安装、升级与迁移流程

defaults:
  runtime: codex

imports:
  - ref: local:../../../../../../agents/shared

profiles:
  default:
    uses:
      skills: [rig-lifecycle, openrig-upgrade, systematic-debugging, verification-before-completion]
      guidance: [role]
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config]

resources:
  guidance:
    - id: role
      path: guidance/role.md
      target: AGENTS.md
      merge: managed_block

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
