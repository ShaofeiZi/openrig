name: advisor.lead
version: "1.0"
description: 顾问负责人——引导用户意图，判断应做什么，并请操作员或队列 worker 实际执行

defaults:
  runtime: claude-code

imports:
  - ref: local:../../../../../../agents/shared

profiles:
  default:
    uses:
      skills: [openrig-architect, requirements-writer]
      guidance: [role]
      subagents: []
      plugins: [shared:openrig-core]
      runtime_resources: [shared:claude-default-settings, shared:claude-default-mcp, shared:codex-default-config]

resources:
  guidance:
    - id: role
      path: guidance/role.md
      target: CLAUDE.md
      merge: managed_block

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
    - path: startup/context.md
      delivery_hint: send_text
      required: true
  actions: []
