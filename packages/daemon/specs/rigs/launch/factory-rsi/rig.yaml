version: "0.2"
name: factory-rsi
culture_file: CULTURE.md
summary: >
  单工作组 RSI 工厂 MVP（OPR.0.4.6.FAC2）：一个工作组，其席位与 `factory-rsi` 工作流
  一一映射；内循环规划、构建、检查并评审一个 slice，随后准备发布。Dogfood 与主循环解耦：
  它在主流程之外持续使用已交付产品，并把发现反馈给下一轮计划，形成递归自我改进边，无需人类
  参与循环。使用 `zrig up factory-rsi` 运行，再实例化 `factory-rsi` 工作流并观察闭环。席位继承
  对应运行时的默认模型；QA、评审和 dogfood 使用与构建者不同的运行时，以获得跨运行时多样性。

# 七个 Pod 各含一个成员，因此每个规范会话名均为 `<pod>-<member>@factory-rsi`，并与工作流的
# preferred_targets 一一对应。
pods:
  - id: plan
    label: 规划
    members:
      - id: planner
        agent_ref: "local:../../../agents/conveyor/planner"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: build
    label: 构建
    members:
      - id: implementer
        agent_ref: "local:../../../agents/development/implementer"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: check
    label: 检查
    members:
      - id: qa
        agent_ref: "local:../../../agents/development/qa"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

  - id: review
    label: 评审
    members:
      - id: reviewer
        agent_ref: "local:../../../agents/review/independent-reviewer"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

  - id: dogfood
    label: Dogfood
    members:
      - id: tester
        agent_ref: "local:../../../agents/factory-rsi/dogfood"
        runtime: codex
        profile: default
        cwd: "."
    edges: []

  - id: release
    label: 发布
    members:
      - id: manager
        agent_ref: "local:../../../agents/factory-rsi/release-manager"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

  - id: orch
    label: 编排
    members:
      - id: lead
        agent_ref: "local:../../../agents/orchestration/orchestrator"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

# 编排智能体沿流水线委派任务；评审与检查可以观察构建。工作流路由由 `factory-rsi` 规范负责
#（引擎为闭环执行路由）；这些边只是拓扑提示，不承担路由。
edges:
  - kind: delegates_to
    from: orch.lead
    to: plan.planner
  - kind: delegates_to
    from: orch.lead
    to: build.implementer
  - kind: delegates_to
    from: orch.lead
    to: check.qa
  - kind: delegates_to
    from: orch.lead
    to: review.reviewer
  - kind: delegates_to
    from: orch.lead
    to: dogfood.tester
  - kind: delegates_to
    from: orch.lead
    to: release.manager
  - kind: can_observe
    from: check.qa
    to: build.implementer
  - kind: can_observe
    from: review.reviewer
    to: build.implementer
