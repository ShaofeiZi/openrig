version: "0.2"
name: secrets-manager
summary: >
  以开发模式运行 HashiCorp Vault，并配备专用 Vault 专家智能体。Vault 会在专家启动前
  先行启动并通过健康门禁，同时捕获环境回执。专家可通过 Vault HTTP API 读取、写入、
  列出和删除密钥。

services:
  kind: compose
  compose_file: secrets-manager.compose.yaml
  project_name: openrig-secrets
  down_policy: down
  wait_for:
    - url: http://127.0.0.1:8200/v1/sys/health
  surfaces:
    urls:
      - name: Vault UI
        url: http://127.0.0.1:8200/ui
      - name: Vault API
        url: http://127.0.0.1:8200/v1
    commands:
      - name: Vault 状态
        command: "vault status -address=http://127.0.0.1:8200"

pods:
  - id: vault
    label: Vault
    members:
      - id: specialist
        agent_ref: "local:../../../agents/apps/vault-specialist"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

edges: []
