# 缺陷类别：pane-render 与 receipt 不一致（send --verify 诚实性）。
# Marathon 来源：`rig send --verify` 在投递/接收（消息已入队）时报告成功，
#   但文本从未在席位 pane 中渲染——这种假阳性掩盖了卡死席位。
# SEED（class: verify-is-receipt-not-render）：种子回归使 --verify 在收到 receipt 时 ACK，
#   却未确认 pane 渲染。`expect pane contains marker` 必须发现它——即使 send 显示“成功”，
#   diff 仍会展示预期 pane 中存在 marker 与观察到的空 pane，并标明 receipt-not-render 类别。
# 依赖：send{verify} + pane 界面（R-10）。不使用 emit。
scenario: send-verify-means-rendered
topology: ./solo-stub.yaml
steps:
  - up: {}
  - send: {to: work-worker@solo-stub, text: "render-marker-7f3a", verify: true}
  # --verify 必须表示已渲染：pane 中可以观察到完全相同的文本。
  - expect:
      surface: pane
      seat: work-worker@solo-stub
      within: 30s
      contains: "render-marker-7f3a"
  - seed_regression: {class: verify-is-receipt-not-render}
