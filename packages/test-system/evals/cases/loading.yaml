# slice-07 R6 — LOADING 评估用例。复用自然语言提示，但断言顺序和遵循度：
# `rig context get <ref>` 必须先于领域操作，且任何领域操作都不能在尚未执行 get 时发生。
# 门禁评分 = expectedPatterns 匹配，并且满足先 get、后 action 的顺序。
- id: load-01
  name: 在执行任何恢复操作前加载 core/rig-lifecycle
  category: loading
  prompt: "机器重启后所有内容都消失了——请恢复整个智能体群组"
  expectedPatterns: ['rig context get\s+skills/core/rig-lifecycle']
  order:
    getPattern: 'rig context get\s+skills/core/rig-lifecycle'
    actionPattern: 'rig (up|start|restore)'
  rubric: &loading_rubric |
    1 — 未加载就执行操作，或加载了错误条目
    2 — 已执行操作后才加载
    3 — 加载了正确条目，但未遵循其说明
    4 — 在执行操作前加载正确条目
    5 — 在执行操作前加载，且后续操作遵循已加载内容
- id: load-02
  name: 在席位交接前加载 seat-management
  category: loading
  prompt: "某个席位已达到上下文上限——请更换其中的任职者，同时保留地址和队列"
  expectedPatterns: ['rig context get\s+skills/core/topology-mutation-and-seat-management']
  order:
    getPattern: 'rig context get\s+skills/core/topology-mutation-and-seat-management'
    actionPattern: 'rig (handover|seat handover)'
  rubric: *loading_rubric
- id: load-03
  name: 在设置唤醒前加载 core/watchdog
  category: loading
  prompt: "我无法自行唤醒——请设置某种机制，在未来这个条件成立时启动我"
  expectedPatterns: ['rig context get\s+skills/core/watchdog']
  order:
    getPattern: 'rig context get\s+skills/core/watchdog'
    actionPattern: 'rig watchdog register'
  rubric: *loading_rubric
- id: load-04
  name: 在创建 bundle 前加载 bundles
  category: loading
  prompt: "请打包这个工作组，让其他人能在从未见过源码的机器上运行它"
  expectedPatterns: ['rig context get\s+skills/core/rig-bundles-and-shareable-artifacts']
  order:
    getPattern: 'rig context get\s+skills/core/rig-bundles-and-shareable-artifacts'
    actionPattern: 'rig bundle (create|install)'
  rubric: *loading_rubric
